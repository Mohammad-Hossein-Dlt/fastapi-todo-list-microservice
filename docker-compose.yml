services:
  # Nginx
  nginx:
    image: nginx:latest
    restart: always
    depends_on:
      - auth-service
      # - auth-service2
      - todo-list-service
      # - todo-list-service2
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # Auth service -> 2 node
  auth-service:
    working_dir: /app
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth_service
    restart: always
    ports:
      - 81:80
    env_file:
      - .env
    depends_on:
      - mongodb-service
      - postgres-service

  # auth-service2:
  #   working_dir: /app
  #   build:
  #     context: ./auth_service
  #     dockerfile: Dockerfile
  #   container_name: auth_service2
  #   restart: always
  #   env_file:
  #     - .env
  #   depends_on:
  #     - mongodb-service
  #     - postgres-service

  # Todo-list service -> 2 node
  todo-list-service:
    working_dir: /app
    build:
      context: ./todo_list_service
      dockerfile: Dockerfile
    container_name: todo_list_service
    restart: always
    ports:
      - 82:80
    env_file:
      - .env
    depends_on:
      - mongodb-service
      - postgres-service

  # todo-list-service2:
  #   working_dir: /app
  #   build:
  #     context: ./todo_list_service
  #     dockerfile: Dockerfile
  #   container_name: todo_list_service2
  #   restart: always
  #   env_file:
  #     - .env
  #   depends_on:
  #     - mongodb-service
  #     - postgres-service

  # Mongo-db
  mongodb-service:
    image: mongo
    container_name: mongo-db
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB__USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB__PASSWORD}

  # Postgresql
  postgres-service:
    image: postgres
    container_name: postgres-db
    restart: always
    ports:
      - 54032:5432
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES__USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DB_NAME}

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - 8080:80
    env_file:
      - .env
    depends_on:
      - postgres-service

volumes:
  pgdata:
  mongo_data:
